spring.application.name=backend

# Spring Data JPA & PostgreSQL (Supabase)
# As credenciais são lidas de variáveis de ambiente para não expor no Git.
# Para rodar localmente, crie um arquivo application-local.properties com os valores reais.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:senha}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Desabilita o open-in-view
spring.jpa.open-in-view=false

# Multipart (upload de imagens)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
